services:
  mysql:
    image: mysql:8.0
    container_name: rechat_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - ${MYSQL_PORT}:3306
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - rechat_network

  adminer:
    image: adminer:latest
    container_name: rechat_adminer
    restart: always
    ports:
      - ${ADMINER_PORT}:8080
    networks:
      - rechat_network

  redis:
    image: redis:7-alpine
    container_name: rechat_redis
    restart: always
    ports:
      - ${REDIS_PORT:-6379}:6379
    volumes:
      - redis_data:/data
    networks:
      - rechat_network

volumes:
  mysql_data:
  redis_data:

networks:
  rechat_network:
    driver: bridge
      